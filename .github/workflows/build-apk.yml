name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Ключ подписи в GitHub не хранится. Если секреты заданы, CI подпишет APK сам.
      # Если нет, соберётся неподписанный release, который вы подпишете локально.
      - name: Режим подписи
        env:
          KEYSTORE_B64: ${{ secrets.AG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "signed=true" >> "$GITHUB_ENV"
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/antigravity.jks"
            echo "AG_KEYSTORE_PATH=$RUNNER_TEMP/antigravity.jks" >> "$GITHUB_ENV"
            echo "Подпись в CI: включена"
          else
            echo "signed=false" >> "$GITHUB_ENV"
            echo "Подпись в CI: выключена, соберу неподписанный release"
          fi

      - name: Сборка
        env:
          AG_KEYSTORE_PASSWORD: ${{ secrets.AG_KEYSTORE_PASSWORD }}
          AG_KEY_ALIAS: ${{ secrets.AG_KEY_ALIAS }}
          AG_KEY_PASSWORD: ${{ secrets.AG_KEY_PASSWORD }}
          AG_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Проверка подписи (только если подпись в CI включена)
        if: env.signed == 'true'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          R=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          "$APKSIGNER" verify --print-certs "$R"

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: GitHub Release (только теги v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
